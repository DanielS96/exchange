<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>FINØMEN.exchange — Курс RUB ↔ USDT TRC20 (с наценкой)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* === ВЕСЬ ВАШ СТАРЫЙ CSS (скопируйте из index.html) === */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0d1228 100%);
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.3;
      z-index: 0;
    }

    body::before {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      top: -100px;
      left: -100px;
      animation: float1 8s ease-in-out infinite;
    }

    body::after {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      bottom: -50px;
      right: -50px;
      animation: float2 10s ease-in-out infinite;
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(50px, 50px); }
    }

    @keyframes float2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-40px, -60px); }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 520px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.5);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.7rem;
      font-weight: 600;
      margin-top: 8px;
      color: #a5b4fc;
    }

    .card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(147, 162, 192, 0.15);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    button {
      padding: 16px 20px;
      border: 1px solid rgba(147, 162, 192, 0.2);
      border-radius: 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      background: rgba(30, 41, 59, 0.8);
      color: #94a3b8;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Inter', sans-serif;
      position: relative;
      overflow: hidden;
    }

    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
      opacity: 0;
      transition: opacity 0.3s;
      border-radius: 16px;
    }

    button:hover::before {
      opacity: 1;
    }

    button:hover {
      border-color: rgba(99, 102, 241, 0.5);
      color: #e2e8f0;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.2);
    }

    button.active {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    button.active::before {
      opacity: 0;
    }

    .rate-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(147, 162, 192, 0.1);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .rate-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.5), transparent);
    }

    .label {
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .rate {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 8px 0;
      letter-spacing: -0.02em;
      line-height: 1.3;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: nowrap;
      white-space: nowrap;
    }

    .rate-value {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .rate-unit {
      font-size: 0.95rem;
      color: #94a3b8;
      font-weight: 500;
      white-space: nowrap;
    }

    .rate-placeholder {
      font-size: 1.1rem;
      color: #64748b;
      font-weight: 500;
    }

    .updated {
      color: #475569;
      font-size: 0.75rem;
      font-weight: 500;
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .updated::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s ease-in-out infinite;
    }

    .error-badge {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.75rem;
      color: #f87171;
      margin-top: 16px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.5rem; }
      .buttons { grid-template-columns: 1fr; gap: 10px; }
      .rate { font-size: 1.5rem; flex-direction: column; gap: 4px; }
      .rate-value { font-size: 1.5rem; }
      .rate-unit { font-size: 0.85rem; }
      .card { padding: 22px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>FINØMEN.exchange</h1>
      <div class="subtitle">Москва • Курс с наценкой</div>
      <div class="badge">💰 +3 RUB наценка</div>
    </div>

    <div class="card">
      <div class="buttons">
        <button data-key="rub_usdt_msk">RUB → USDT</button>
        <button data-key="usdt_rub_msk">USDT → RUB</button>
      </div>

      <div class="rate-box">
        <div class="label" id="label">Выбери направление</div>
        <div class="rate" id="rate">
          <div class="rate-placeholder">Загрузка...</div>
        </div>
        <div class="updated" id="updated"></div>
        <div id="error" style="display: none;" class="error-badge"></div>
      </div>
    </div>
  </div>

  <script>
    // ========== НАСТРОЙКИ НАЦЕНКИ ДЛЯ ЭТОЙ СТРАНИЦЫ ==========
    const MARKUP_RUB_USDT = 3.0;   // наценка для RUB → USDT
    const MARKUP_USDT_RUB = 3.0;   // наценка для USDT → RUB
    // =========================================================

    let rates = null;

    async function loadRates() {
      const rateEl = document.getElementById("rate");
      const errorEl = document.getElementById("error");
      
      try {
        const response = await fetch(`rate.json?t=${Date.now()}`, {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache' }
        });
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        
        rates = await response.json();
        errorEl.style.display = 'none';
        
        const active = document.querySelector("button.active");
        if (active) {
          showRate(active.dataset.key);
        } else {
          document.querySelector("button[data-key='rub_usdt_msk']").click();
        }
      } catch (err) {
        console.error('Ошибка загрузки курса:', err);
        errorEl.textContent = '⚠️ Не удалось загрузить актуальный курс. Пожалуйста, обновите страницу.';
        errorEl.style.display = 'block';
        rateEl.innerHTML = '<div class="rate-placeholder">Ошибка загрузки</div>';
      }
    }

    function showRate(key) {
      if (!rates) return;
      
      const labels = {
        rub_usdt_msk: "RUB → USDT (Москва) с наценкой",
        usdt_rub_msk: "USDT → RUB (Москва) с наценкой",
      };

      let displayRate;
      if (key === "rub_usdt_msk") {
        displayRate = rates.rub_usdt_msk + MARKUP_RUB_USDT;
      } else {
        displayRate = rates.usdt_rub_msk + MARKUP_USDT_RUB;
      }

      if (!displayRate) {
        document.getElementById("label").textContent = "Ошибка данных";
        document.getElementById("rate").innerHTML = '<div class="rate-placeholder">Нет данных</div>';
        return;
      }

      document.getElementById("label").textContent = labels[key];
      document.getElementById("rate").innerHTML = `<span class="rate-value">${displayRate.toFixed(6)}</span><span class="rate-unit">RUB за 1 USDT</span>`;
      
      if (rates.updated_at) {
        const d = new Date(rates.updated_at);
        document.getElementById("updated").textContent = `Обновлено: ${d.toLocaleString("ru-RU")}`;
      }
    }

    document.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        showRate(btn.dataset.key);
      });
    });

    loadRates();
    setInterval(loadRates, 30000);
  </script>
</body>
</html>
