<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Real Rates — RUB → USDT с графиком</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0b3d3d 0%, #1a5c5c 50%, #0d3d3d 100%);
      color: #e2f0e8;
      padding: 16px 12px 12px 12px;
      position: relative;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }
    
    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.3;
      z-index: 0;
      pointer-events: none;
    }
    
    body::before {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      top: -100px;
      left: -100px;
      animation: float1 8s ease-in-out infinite;
    }
    
    body::after {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, #14b8a6, #2dd4bf);
      bottom: -50px;
      right: -50px;
      animation: float2 10s ease-in-out infinite;
    }
    
    @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(50px,50px); } }
    @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-40px,-60px); } }
    
    .container { 
      position: relative; 
      z-index: 1; 
      max-width: 600px; 
      width: 100%; 
      margin: 0 auto; 
      overflow-x: visible;
    }
    
    .header { 
      text-align: center; 
      margin-bottom: 20px; 
      padding-top: 12px; 
    }
    
    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #6ee7b7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    
    .subtitle { 
      color: #99f6e4; 
      font-size: 0.8rem; 
      font-weight: 500; 
      opacity: 0.9; 
    }
    
    .card {
      background: rgba(15, 45, 45, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(110, 231, 183, 0.2);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
      width: 100%;
    }
    
    .rate-box {
      background: rgba(10, 30, 30, 0.6);
      border: 1px solid rgba(110, 231, 183, 0.15);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      position: relative;
    }
    
    .rate-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(110, 231, 183, 0.6), transparent);
    }
    
    .label { 
      color: #99f6e4; 
      font-size: 0.7rem; 
      font-weight: 600; 
      margin-bottom: 12px; 
      text-transform: uppercase; 
      letter-spacing: 0.08em; 
    }
    
    .rate {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #6ee7b7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 8px 0;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    
    .rate-value { 
      font-size: 1.5rem; 
      font-weight: 800; 
      background: linear-gradient(135deg, #fff 0%, #6ee7b7 100%); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      background-clip: text; 
    }
    
    .rate-unit { 
      font-size: 0.8rem; 
      color: #6ee7b7; 
      font-weight: 500; 
    }
    
    .updated { 
      color: #5e9e8e; 
      font-size: 0.65rem; 
      margin-top: 12px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 6px; 
    }
    
    .updated::before { 
      content: ''; 
      width: 6px; 
      height: 6px; 
      border-radius: 50%; 
      background: #10b981; 
      animation: pulse 2s infinite; 
    }
    
    .error-badge {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.65rem;
      color: #fca5a5;
      margin-top: 10px;
    }
    
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    
    .chart-container { 
      background: rgba(10, 30, 30, 0.6); 
      border: 1px solid rgba(110, 231, 183, 0.15); 
      border-radius: 20px; 
      padding: 16px; 
      margin-top: 16px; 
      width: 100%;
    }
    
    .chart-title { 
      color: #99f6e4; 
      font-size: 0.7rem; 
      font-weight: 600; 
      margin-bottom: 16px; 
      text-align: center; 
      text-transform: uppercase;
    }
    
    .chart-controls { 
      display: flex; 
      justify-content: center; 
      align-items: center;
      gap: 8px; 
      margin-bottom: 16px; 
      flex-direction: row;
      flex-wrap: nowrap;
    }
    
    .chart-btn {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(110, 231, 183, 0.3);
      border-radius: 20px;
      padding: 5px 12px;
      color: #99f6e4;
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.3s;
      min-width: 55px;
      max-width: 70px;
      text-align: center;
      white-space: nowrap;
    }
    
    .chart-btn:hover { background: rgba(16, 185, 129, 0.4); }
    .chart-btn.active { background: #10b981; color: #0b3d3d; }
    
    .chart-wrapper {
      width: 100%;
      overflow-x: visible;
    }
    
    canvas { 
      max-height: 280px; 
      width: 100% !important; 
      height: auto !important;
    }
    
    .stats { 
      display: flex; 
      justify-content: space-between; 
      gap: 8px; 
      margin-top: 16px; 
      flex-wrap: wrap; 
    }
    
    .stat-card { 
      background: rgba(10, 30, 30, 0.4); 
      border-radius: 8px; 
      padding: 8px; 
      flex: 1; 
      text-align: center; 
      min-width: 65px;
    }
    
    .stat-label { 
      font-size: 0.6rem; 
      color: #5e9e8e; 
      text-transform: uppercase; 
    }
    
    .stat-value { 
      font-size: 0.8rem; 
      font-weight: 600; 
      color: #6ee7b7; 
      margin-top: 4px; 
    }
    
    /* Мобильные стили */
    @media (max-width: 600px) {
      body {
        padding: 12px 10px 10px 10px;
      }
      
      .header {
        padding-top: 8px;
        margin-bottom: 16px;
      }
      
      h1 {
        font-size: 1.4rem;
      }
      
      .subtitle {
        font-size: 0.75rem;
      }
      
      .card {
        padding: 12px;
      }
      
      .rate {
        font-size: 1.3rem;
      }
      
      .rate-value {
        font-size: 1.3rem;
      }
      
      .rate-unit {
        font-size: 0.75rem;
      }
      
      .label {
        font-size: 0.65rem;
      }
      
      .chart-container {
        padding: 12px;
      }
      
      .chart-title {
        font-size: 0.65rem;
        margin-bottom: 12px;
      }
      
      .chart-btn {
        padding: 5px 10px;
        font-size: 0.65rem;
        min-width: 50px;
        max-width: 60px;
      }
      
      .chart-controls {
        gap: 6px;
      }
      
      .stat-card {
        padding: 6px;
        min-width: 55px;
      }
      
      .stat-label {
        font-size: 0.55rem;
      }
      
      .stat-value {
        font-size: 0.7rem;
      }
    }
    
    @media (max-width: 400px) {
      .chart-btn {
        padding: 4px 8px;
        font-size: 0.6rem;
        min-width: 45px;
        max-width: 55px;
      }
      
      .chart-controls {
        gap: 5px;
      }
      
      .stat-value {
        font-size: 0.65rem;
      }
      
      .stat-label {
        font-size: 0.5rem;
      }
      
      .rate-value {
        font-size: 1.1rem;
      }
      
      .rate-unit {
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Real Rates</h1>
    <div class="subtitle">Москва • RUB → USDT</div>
  </div>
  <div class="card">
    <div class="rate-box">
      <div class="label" id="label">RUB → USDT (Москва)</div>
      <div class="rate" id="rate"><div class="rate-placeholder">Загрузка...</div></div>
      <div class="updated" id="updated"></div>
      <div id="error" style="display: none;" class="error-badge"></div>
    </div>
  </div>
  <div class="chart-container">
    <div class="chart-title">ДИНАМИКА КУРСА RUB → USDT</div>
    <div class="chart-controls">
      <button class="chart-btn" data-range="1h">1ч</button>
      <button class="chart-btn" data-range="24h">24ч</button>
      <button class="chart-btn" data-range="7d">7д</button>
    </div>
    <div class="chart-wrapper">
      <canvas id="rateChart"></canvas>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</div>

<script>
  const MARKUP_RUB_USDT = 3.0;
  let rates = null;
  let chart = null;
  let fullHistory = [];
  let currentRange = '1h';

  async function loadRates() {
    try {
      const response = await fetch(`rate.json?t=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      rates = await response.json();
      document.getElementById('error').style.display = 'none';
      showRate();
    } catch (err) {
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent = '⚠️ Ошибка загрузки курса';
      document.getElementById('rate').innerHTML = '<div class="rate-placeholder">Ошибка</div>';
    }
  }

  function showRate() {
    if (!rates?.rub_usdt_msk) return;
    const displayRate = rates.rub_usdt_msk + MARKUP_RUB_USDT;
    document.getElementById('rate').innerHTML = `<span class="rate-value">${displayRate.toFixed(2)}</span><span class="rate-unit">RUB за 1 USDT</span>`;
    if (rates.updated_at) {
      const d = new Date(rates.updated_at);
      document.getElementById('updated').textContent = `Обновлено: ${d.toLocaleString("ru-RU")}`;
    }
  }

  function filterHistoryByRange(range) {
    if (!fullHistory.length) return [];
    const now = new Date();
    let startDate;
    switch(range) {
      case '1h': startDate = new Date(now.getTime() - 60*60*1000); break;
      case '24h': startDate = new Date(now.getTime() - 24*3600*1000); break;
      case '7d': startDate = new Date(now.getTime() - 7*24*3600*1000); break;
      default: return fullHistory;
    }
    return fullHistory.filter(item => new Date(item.time) >= startDate);
  }

  function calculateStats(filteredHistory) {
    if (!filteredHistory.length) return null;
    const ratesArr = filteredHistory.map(item => item.rate);
    const min = Math.min(...ratesArr);
    const max = Math.max(...ratesArr);
    const first = ratesArr[0];
    const last = ratesArr[ratesArr.length - 1];
    const change = last - first;
    const changePercent = (change / first) * 100;
    return { min, max, first, last, change, changePercent };
  }

  function updateStats(filteredHistory) {
    const stats = calculateStats(filteredHistory);
    if (!stats) return;
    document.getElementById('stats').innerHTML = `
      <div class="stat-card"><div class="stat-label">МИНИМУМ</div><div class="stat-value">${stats.min.toFixed(2)}</div></div>
      <div class="stat-card"><div class="stat-label">МАКСИМУМ</div><div class="stat-value">${stats.max.toFixed(2)}</div></div>
      <div class="stat-card"><div class="stat-label">ИЗМЕНЕНИЕ</div><div class="stat-value" style="color: ${stats.change >= 0 ? '#6ee7b7' : '#fca5a5'}">${stats.change >= 0 ? '+' : ''}${stats.change.toFixed(2)} (${stats.changePercent.toFixed(1)}%)</div></div>
      <div class="stat-card"><div class="stat-label">ТЕКУЩИЙ</div><div class="stat-value">${stats.last.toFixed(2)}</div></div>
    `;
  }

  function updateChart() {
    if (!fullHistory.length) return;
    const filteredHistory = filterHistoryByRange(currentRange);
    if (filteredHistory.length === 0) return;
    
    const times = filteredHistory.map(item => item.time);
    const ratesWithMarkup = filteredHistory.map(item => item.rate + MARKUP_RUB_USDT);
    const filteredForStats = filteredHistory.map(item => ({ rate: item.rate + MARKUP_RUB_USDT }));
    const stats = calculateStats(filteredForStats);
    if (stats) updateStats(filteredForStats);
    
    if (chart) {
      chart.data.labels = times;
      chart.data.datasets[0].data = ratesWithMarkup;
      chart.update();
    } else {
      const ctx = document.getElementById('rateChart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: times,
          datasets: [{
            data: ratesWithMarkup,
            borderColor: '#10b981',
            backgroundColor: 'rgba(16, 185, 129, 0.1)',
            borderWidth: 2,
            pointRadius: 0,
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: (ctx) => `${ctx.parsed.y.toFixed(2)} RUB за 1 USDT` } }
          },
          scales: {
            y: { 
              grid: { color: 'rgba(110, 231, 183, 0.1)' }, 
              ticks: { color: '#99f6e4', font: { size: 10 } } 
            },
            x: { display: false }
          }
        }
      });
    }
  }

  async function loadHistory() {
    try {
      const response = await fetch(`history.json?t=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) return;
      const history = await response.json();
      fullHistory = history.rub_usdt_history || [];
      if (fullHistory.length) updateChart();
    } catch (err) { console.error(err); }
  }

  // Обработчики кнопок диапазонов графика
  document.querySelectorAll('.chart-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.chart-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRange = btn.dataset.range;
      updateChart();
    });
  });

  // Устанавливаем активную кнопку "1ч" по умолчанию
  const defaultRangeBtn = document.querySelector('.chart-btn[data-range="1h"]');
  if (defaultRangeBtn) defaultRangeBtn.classList.add('active');

  loadRates();
  loadHistory();
  setInterval(() => { loadRates(); loadHistory(); }, 30000);
</script>
</body>
</html>
