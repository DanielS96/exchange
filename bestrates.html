<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Best Rates — RUB → USDT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes, viewport-fit=cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e2e8f0;
      padding: 16px 12px 12px 12px;
      position: relative;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.3;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #e2b714, #f59e0b);
      top: -100px;
      left: -100px;
      animation: float1 8s ease-in-out infinite;
    }

    body::after {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, #f97316, #fbbf24);
      bottom: -50px;
      right: -50px;
      animation: float2 10s ease-in-out infinite;
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(50px, 50px); }
    }

    @keyframes float2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-40px, -60px); }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      overflow-x: visible;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      padding-top: 12px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .subtitle {
      color: #fcd34d;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      opacity: 0.9;
    }

    .card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(251, 191, 36, 0.2);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(251, 191, 36, 0.1);
      margin-bottom: 16px;
      width: 100%;
    }

    .rate-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(251, 191, 36, 0.15);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .rate-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(251, 191, 36, 0.6), transparent);
    }

    .label {
      color: #fcd34d;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .rate {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 8px 0;
      letter-spacing: -0.02em;
      line-height: 1.3;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .rate-value {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .rate-unit {
      font-size: 0.85rem;
      color: #fbbf24;
      font-weight: 500;
      white-space: normal;
    }

    .rate-placeholder {
      font-size: 1rem;
      color: #64748b;
      font-weight: 500;
    }

    .updated {
      color: #5e9e8e;
      font-size: 0.65rem;
      font-weight: 500;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .updated::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fbbf24;
      animation: pulse 2s ease-in-out infinite;
    }

    .error-badge {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.7rem;
      color: #fca5a5;
      margin-top: 12px;
    }

    .date-container {
      margin-bottom: 20px;
    }

    .date-label {
      color: #fcd34d;
      font-size: 0.7rem;
      font-weight: 500;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .date-input {
      width: 100%;
      padding: 12px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(251, 191, 36, 0.3);
      border-radius: 12px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .date-input::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @media (max-width: 600px) {
      body {
        padding: 12px 10px 10px 10px;
      }
      
      .header {
        padding-top: 8px;
        margin-bottom: 16px;
      }
      
      h1 {
        font-size: 1.5rem;
      }
      
      .subtitle {
        font-size: 0.75rem;
      }
      
      .card {
        padding: 16px;
      }
      
      .rate {
        font-size: 1.3rem;
      }
      
      .rate-value {
        font-size: 1.3rem;
      }
      
      .rate-unit {
        font-size: 0.75rem;
      }
      
      .label {
        font-size: 0.7rem;
      }
      
      .date-input {
        padding: 10px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Best Rates</h1>
      <div class="subtitle">Москва • RUB → USDT</div>
    </div>

    <div class="card">
      <div class="date-container">
        <div class="date-label">📅 ВЫБЕРИТЕ ДАТУ</div>
        <input type="date" class="date-input" id="datePicker" value="2026-05-04">
      </div>

      <div class="rate-box">
        <div class="label" id="label">RUB → USDT (Москва)</div>
        <div class="rate" id="rate">
          <div class="rate-placeholder">Загрузка...</div>
        </div>
        <div class="updated" id="updated"></div>
        <div id="error" style="display: none;" class="error-badge"></div>
      </div>
    </div>
  </div>

  <script>
    // Настройка: курс на 1 меньше, наценка 2 рубля
    const MARKUP_RUB_USDT = 2.0;
    const BASE_OFFSET = -1.0;  // на 1 рубль меньше базового курса

    let rates = null;

    async function loadRates() {
      const rateEl = document.getElementById("rate");
      const errorEl = document.getElementById("error");
      
      try {
        const response = await fetch(`rate.json?t=${Date.now()}`, {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache' }
        });
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        
        rates = await response.json();
        errorEl.style.display = 'none';
        showRate();
      } catch (err) {
        console.error('Ошибка загрузки курса:', err);
        errorEl.textContent = '⚠️ Не удалось загрузить актуальный курс. Пожалуйста, обновите страницу.';
        errorEl.style.display = 'block';
        rateEl.innerHTML = '<div class="rate-placeholder">Ошибка загрузки</div>';
      }
    }

    function showRate() {
      if (!rates) return;
      
      const baseRate = rates.rub_usdt_msk;
      if (!baseRate) {
        document.getElementById("rate").innerHTML = '<div class="rate-placeholder">Нет данных</div>';
        return;
      }

      // Курс: базовый - 1 рубль + наценка 2 рубля = базовый + 1 рубль
      // (то есть на 1 рубль меньше, чем в Real Rates, где было базовый + 3)
      const displayRate = baseRate + BASE_OFFSET + MARKUP_RUB_USDT;
      document.getElementById("rate").innerHTML = `<span class="rate-value">${displayRate.toFixed(6)}</span><span class="rate-unit">RUB за 1 USDT</span>`;
      
      if (rates.updated_at) {
        const d = new Date(rates.updated_at);
        document.getElementById("updated").textContent = `Обновлено: ${d.toLocaleString("ru-RU")}`;
      }
    }

    // Устанавливаем дату 04.05.2026 (в формате YYYY-MM-DD)
    document.getElementById('datePicker').value = '2026-05-04';

    loadRates();
    setInterval(loadRates, 30000);
  </script>
</body>
</html>
