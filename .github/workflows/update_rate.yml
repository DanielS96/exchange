name: Update Exchange Rates

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4
        
    - name: Run fetch script
      run: python fetch_rates.py
      
    - name: Commit and force push
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        
        if git diff --quiet rate.json; then
          echo "✅ No changes to commit"
          exit 0
        fi
        
        git add rate.json
        git commit -m "Update rates at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        
        # Сначала получаем последние изменения
        git fetch origin main
        
        # Перебазируем наши изменения поверх последних
        git rebase origin/main || {
          echo "⚠️ Rebase failed, resolving conflict in rate.json..."
          # При конфликте берём нашу версию
          git checkout --ours rate.json
          git add rate.json
          git rebase --continue
        }
        
        # Безопасный force push
        git push origin main --force-with-lease
        
        echo "✅ Successfully updated and pushed rates"
