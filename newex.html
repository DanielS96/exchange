<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Real Rates — RUB → USDT с графиком</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0b3d3d 0%, #1a5c5c 50%, #0d3d3d 100%);
      color: #e2f0e8;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.3;
      z-index: 0;
    }
    body::before {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      top: -100px;
      left: -100px;
      animation: float1 8s ease-in-out infinite;
    }
    body::after {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, #14b8a6, #2dd4bf);
      bottom: -50px;
      right: -50px;
      animation: float2 10s ease-in-out infinite;
    }
    @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(50px,50px); } }
    @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-40px,-60px); } }
    .container { position: relative; z-index: 1; max-width: 1200px; width: 100%; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 32px; padding-top: 20px; }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #6ee7b7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    .subtitle { color: #99f6e4; font-size: 0.95rem; font-weight: 500; opacity: 0.9; }
    .card {
      background: rgba(15, 45, 45, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(110, 231, 183, 0.2);
      border-radius: 24px;
      padding: 28px;
      margin-bottom: 20px;
    }
    .rate-box {
      background: rgba(10, 30, 30, 0.6);
      border: 1px solid rgba(110, 231, 183, 0.15);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      position: relative;
    }
    .rate-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(110, 231, 183, 0.6), transparent);
    }
    .label { color: #99f6e4; font-size: 0.85rem; font-weight: 600; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.08em; }
    .rate {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #6ee7b7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 12px 0;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
    }
    .rate-value { font-size: 2.5rem; font-weight: 800; background: linear-gradient(135deg, #fff 0%, #6ee7b7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .rate-unit { font-size: 1rem; color: #6ee7b7; font-weight: 500; }
    .updated { color: #5e9e8e; font-size: 0.75rem; margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .updated::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #10b981; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .chart-container { background: rgba(10, 30, 30, 0.6); border: 1px solid rgba(110, 231, 183, 0.15); border-radius: 20px; padding: 20px; margin-top: 20px; }
    .chart-title { color: #99f6e4; font-size: 0.85rem; font-weight: 600; margin-bottom: 16px; text-align: center; }
    .chart-controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .chart-btn {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(110, 231, 183, 0.3);
      border-radius: 8px;
      padding: 6px 12px;
      color: #99f6e4;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .chart-btn:hover { background: rgba(16, 185, 129, 0.4); }
    .chart-btn.active { background: #10b981; color: #0b3d3d; }
    canvas { max-height: 400px; width: 100%; }
    .stats { display: flex; justify-content: space-between; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
    .stat-card { background: rgba(10, 30, 30, 0.4); border-radius: 12px; padding: 12px; flex: 1; text-align: center; }
    .stat-label { font-size: 0.7rem; color: #5e9e8e; text-transform: uppercase; }
    .stat-value { font-size: 1.1rem; font-weight: 600; color: #6ee7b7; margin-top: 4px; }
    @media (max-width: 768px) {
      h1 { font-size: 1.5rem; }
      .rate { font-size: 1.75rem; }
      .rate-value { font-size: 1.75rem; }
      .stats { flex-direction: column; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Real Rates</h1>
    <div class="subtitle">Москва • RUB → USDT</div>
  </div>
  <div class="card">
    <div class="rate-box">
      <div class="label" id="label">RUB → USDT (Москва)</div>
      <div class="rate" id="rate"><div class="rate-placeholder">Загрузка...</div></div>
      <div class="updated" id="updated"></div>
      <div id="error" style="display: none;" class="error-badge"></div>
    </div>
  </div>
  <div class="chart-container">
    <div class="chart-title">📈 Динамика курса RUB → USDT</div>
    <div class="chart-controls">
      <button class="chart-btn" data-range="1h">1 час</button>
      <button class="chart-btn" data-range="24h">24 часа</button>
      <button class="chart-btn" data-range="7d">7 дней</button>
      <button class="chart-btn active" data-range="30d">30 дней</button>
    </div>
    <canvas id="rateChart"></canvas>
    <div class="stats" id="stats"></div>
  </div>
</div>

<script>
  const MARKUP_RUB_USDT = 3.0;
  let rates = null;
  let chart = null;
  let fullHistory = [];
  let currentRange = '30d';

  async function loadRates() {
    try {
      const response = await fetch(`rate.json?t=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      rates = await response.json();
      document.getElementById('error').style.display = 'none';
      showRate();
    } catch (err) {
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent = '⚠️ Ошибка загрузки курса';
      document.getElementById('rate').innerHTML = '<div class="rate-placeholder">Ошибка</div>';
    }
  }

  function showRate() {
    if (!rates?.rub_usdt_msk) return;
    const displayRate = rates.rub_usdt_msk + MARKUP_RUB_USDT;
    document.getElementById('rate').innerHTML = `<span class="rate-value">${displayRate.toFixed(6)}</span><span class="rate-unit">RUB за 1 USDT</span>`;
    if (rates.updated_at) {
      const d = new Date(rates.updated_at);
      document.getElementById('updated').textContent = `Обновлено: ${d.toLocaleString("ru-RU")}`;
    }
  }

  function filterHistoryByRange(range) {
    if (!fullHistory.length) return [];
    const now = new Date();
    let startDate;
    switch(range) {
      case '1h': startDate = new Date(now.getTime() - 60*60*1000); break;
      case '24h': startDate = new Date(now.getTime() - 24*3600*1000); break;
      case '7d': startDate = new Date(now.getTime() - 7*24*3600*1000); break;
      case '30d': startDate = new Date(now.getTime() - 30*24*3600*1000); break;
      default: return fullHistory;
    }
    return fullHistory.filter(item => new Date(item.time) >= startDate);
  }

  function calculateStats(filteredHistory) {
    if (!filteredHistory.length) return null;
    const ratesArr = filteredHistory.map(item => item.rate);
    const min = Math.min(...ratesArr);
    const max = Math.max(...ratesArr);
    const first = ratesArr[0];
    const last = ratesArr[ratesArr.length - 1];
    const change = last - first;
    const changePercent = (change / first) * 100;
    return { min, max, first, last, change, changePercent };
  }

  function updateStats(filteredHistory) {
    const stats = calculateStats(filteredHistory);
    if (!stats) return;
    document.getElementById('stats').innerHTML = `
      <div class="stat-card"><div class="stat-label">Минимум</div><div class="stat-value">${stats.min.toFixed(6)}</div></div>
      <div class="stat-card"><div class="stat-label">Максимум</div><div class="stat-value">${stats.max.toFixed(6)}</div></div>
      <div class="stat-card"><div class="stat-label">Изменение</div><div class="stat-value" style="color: ${stats.change >= 0 ? '#6ee7b7' : '#fca5a5'}">${stats.change >= 0 ? '+' : ''}${stats.change.toFixed(6)} (${stats.changePercent.toFixed(2)}%)</div></div>
      <div class="stat-card"><div class="stat-label">Текущий</div><div class="stat-value">${stats.last.toFixed(6)}</div></div>
    `;
  }

  function updateChart() {
    if (!fullHistory.length) return;
    const filteredHistory = filterHistoryByRange(currentRange);
    if (filteredHistory.length === 0) return;
    
    const times = filteredHistory.map(item => item.time);
    const ratesWithMarkup = filteredHistory.map(item => item.rate + MARKUP_RUB_USDT);
    const filteredForStats = filteredHistory.map(item => ({ rate: item.rate + MARKUP_RUB_USDT }));
    const stats = calculateStats(filteredForStats);
    if (stats) updateStats(filteredForStats);
    
    if (chart) {
      chart.data.labels = times;
      chart.data.datasets[0].data = ratesWithMarkup;
      chart.update();
    } else {
      const ctx = document.getElementById('rateChart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: times,
          datasets: [{
            data: ratesWithMarkup,
            borderColor: '#10b981',
            backgroundColor: 'rgba(16, 185, 129, 0.1)',
            borderWidth: 2,
            pointRadius: 2,
            pointBackgroundColor: '#6ee7b7',
            pointBorderColor: '#0b3d3d',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: (ctx) => `${ctx.parsed.y.toFixed(6)} RUB за 1 USDT` } }
          },
          scales: {
            y: { 
              grid: { color: 'rgba(110, 231, 183, 0.1)' }, 
              ticks: { color: '#99f6e4' } 
            },
            x: { 
              display: false  // ПОЛНОСТЬЮ УБИРАЕМ ГОРИЗОНТАЛЬНУЮ ОСЬ
            }
          }
        }
      });
    }
  }

  async function loadHistory() {
    try {
      const response = await fetch(`history.json?t=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) return;
      const history = await response.json();
      fullHistory = history.rub_usdt_history || [];
      if (fullHistory.length) updateChart();
    } catch (err) { console.error(err); }
  }

  document.querySelectorAll('.chart-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.chart-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRange = btn.dataset.range;
      updateChart();
    });
  });

  loadRates();
  loadHistory();
  setInterval(() => { loadRates(); loadHistory(); }, 30000);
</script>
</body>
</html>
